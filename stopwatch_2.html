<style>

  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--t1);

  .chart-panel { display:flex; flex-direction:column; min-height:440px; }
  .name { font-size:15px; color:var(--t2); font-weight:600; }
  .price { font-size:28px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .chg { font-size:15px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums; }
  .date { font-size:13px; color:var(--t3); margin-top:6px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  #mood { width:96px; height:96px; border-radius:16px; object-fit:cover; visibility:hidden; }
  #mood.pop { animation:pop .25s ease-out; }
  @keyframes pop { from { transform:scale(.85); } to { transform:scale(1); } }
  .chart-wrap { position:relative; flex:1; margin-top:16px; min-height:260px; }
  #chart { position:absolute; inset:0; width:100%; height:100%; }
  .sw-panel { display:flex; flex-direction:column; }
  .label { font-size:15px; color:var(--t2); font-weight:600; }
  #display { font-size:clamp(40px,6vw,56px); font-weight:700; letter-spacing:-1px; margin:12px 0 24px;
             font-variant-numeric:tabular-nums; }
  #display small { font-size:.55em; color:var(--t3); }
  .btns { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  button { padding:14px 0; font:600 16px inherit; font-family:inherit; border:0; border-radius:14px; cursor:pointer;
           background:var(--card2); color:var(--t1); transition:background .15s; }
  button:hover { background:#2C313A; }
  button:disabled { color:var(--t4); cursor:default; background:var(--card2); }
  #start { background:var(--blue); color:#fff; }
  #start:hover { background:var(--blue-press); }
  #start.running { background:var(--card2); color:var(--up); }
  #laps { list-style:none; margin:20px 0 0; padding:0; flex:1; max-height:260px; overflow-y:auto; }
  #laps li { display:flex; justify-content:space-between; padding:12px 2px; font-size:15px; color:var(--t2);
             font-variant-numeric:tabular-nums; }
  #laps li + li { border-top:1px solid #262A32; }
  #laps .best { color:var(--down); } #laps .worst { color:var(--up); }
  .hint { color:var(--t4); font-size:12px; margin-top:16px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } .chart-panel { min-height:360px; } }
</style>
</head>

  function lap() {
    if (!timer) return;
    laps.push(elapsed - lastLap); lastLap = elapsed;
    const min = Math.min(...laps), max = Math.max(...laps);
    $('laps').innerHTML = laps.map((l, i) => {
      const cls = laps.length > 1 ? (l === min ? 'best' : l === max ? 'worst' : '') : '';
      return `<li class="${cls}"><span>랩 ${i + 1}</span><span>${fmt(l)}</span></li>`;
    }).reverse().join('');
  }
  function reset() {
    clearInterval(timer); timer = null; elapsed = 0; lastLap = 0; laps = [];
    $('start').textContent = '시작'; $('start').classList.remove('running');
    $('lap').disabled = true; $('laps').innerHTML = ''; shownIdx = -1; render();
  }

  // ===== 코스피 일봉 차트 =====
  const VISIBLE = 80, cv = $('chart'), ctx = cv.getContext('2d');
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const UP = css('--up'), DOWN = css('--down'), GRID = '#262A32', AXIS = css('--t3');

  function drawChart(idx) {
    const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    if (!candles.length) return;
    const i = Math.min(idx, candles.length - 1), end = i + 1, start = Math.max(0, end - VISIBLE);
    const vis = candles.slice(start, end), last = candles[i], prev = candles[i - 1];

    // 헤더
    $('price').textContent = last.c.toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    $('date').textContent = last.d;
    if (prev) {
      const d = last.c - prev.c, r = d / prev.c * 100, cls = d >= 0 ? 'up' : 'down', sign = d >= 0 ? '+' : '';
      $('chg').className = 'chg ' + cls; $('chg').textContent = `${sign}${d.toFixed(2)} (${sign}${r.toFixed(2)}%)`;
      setMood(cls);
    } else { $('chg').className = 'chg'; $('chg').innerHTML = '&nbsp;'; setMood(''); }

    // 스케일
    let hi = -Infinity, lo = Infinity;
    vis.forEach(c => { hi = Math.max(hi, c.h); lo = Math.min(lo, c.l); });
    const pad = (hi - lo || hi * .01) * .08; hi += pad; lo -= pad;
    const axisW = 64, cw = (W - axisW) / VISIBLE, y = v => (hi - v) / (hi - lo) * H;

    // 가로 그리드 + 가격축
    ctx.font = '12px Pretendard, sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'right';
    for (let k = 0; k <= 4; k++) {
      const v = lo + (hi - lo) * k / 4, yy = Math.round(y(v)) + .5;
      ctx.strokeStyle = GRID; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W - axisW, yy); ctx.stroke();
      ctx.fillStyle = AXIS; ctx.fillText(v.toFixed(0), W - 4, Math.min(Math.max(yy, 8), H - 8));
    }

    // 캔들
    vis.forEach((c, k) => {
      const x = k * cw + cw / 2, color = c.c >= c.o ? UP : DOWN;
      ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, y(c.h)); ctx.lineTo(Math.round(x) + .5, y(c.l)); ctx.stroke();
      const top = y(Math.max(c.o, c.c)), bh = Math.max(1, Math.abs(y(c.o) - y(c.c)));
      ctx.fillRect(x - cw * .36, top, cw * .72, bh);
    });

    // 현재가 라벨
    const ly = y(last.c), lc = last.c >= last.o ? UP : DOWN;
    ctx.setLineDash([3, 3]); ctx.strokeStyle = lc; ctx.beginPath();
    ctx.moveTo(0, ly); ctx.lineTo(W - axisW, ly); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = lc; ctx.fillRect(W - axisW + 2, ly - 10, axisW - 2, 20);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(last.c.toFixed(2), W - axisW / 2 + 1, ly);
  }
  function setMood(m) {
    if (m === moodNow) return; moodNow = m; const el = $('mood');
    if (!m) { el.style.visibility = 'hidden'; return; }
    el.src = MOOD[m]; el.alt = m === 'up' ? '상승' : '하락'; el.style.visibility = 'visible';
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  }
  new ResizeObserver(() => drawChart(Math.max(shownIdx, 0))).observe(cv);

  $('start').onclick = toggle; $('lap').onclick = lap; $('reset').onclick = reset;
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key.toLowerCase() === 'l') lap();
    else if (e.key.toLowerCase() === 'r') reset();
  });
  render();
</script>
</body>
</html>
